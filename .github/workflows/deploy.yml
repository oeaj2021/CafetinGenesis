name: CI/CD - Dokploy Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: 🔍 Build & Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate & Test Backend
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm run test:security

      - name: Validate & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: 🚀 Trigger Dokploy VPS Auto-Deploy
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Call Dokploy Deploy Webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "⚠️ DOKPLOY_WEBHOOK_URL no configurado en los Secretos de GitHub (Settings -> Secrets and variables -> Actions)."
            echo "ℹ️ Si configuraste el Webhook nativo de Dokploy en GitHub (Settings -> Webhooks), Dokploy se actualizará directamente."
            exit 0
          fi
          echo "🚀 Disparando despliegue en VPS Dokploy..."
          HTTP_STATUS=$(curl -X POST -s -o /dev/null -w "%{http_code}" "$DOKPLOY_WEBHOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Dokploy Webhook disparado con éxito (HTTP $HTTP_STATUS)."
          else
            echo "⚠️ Falló la llamada POST (HTTP $HTTP_STATUS). Intentando con GET..."
            GET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DOKPLOY_WEBHOOK_URL")
            if [ "$GET_STATUS" -ge 200 ] && [ "$GET_STATUS" -lt 400 ]; then
              echo "✅ Dokploy Webhook disparado con éxito vía GET (HTTP $GET_STATUS)."
            else
              echo "❌ Error al disparar Webhook de Dokploy (HTTP $GET_STATUS)."
              exit 1
            fi
          fi

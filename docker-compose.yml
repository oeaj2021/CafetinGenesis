services:
  postgres:
    image: postgres:16-alpine
    container_name: genesis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genesis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genesis_pass}
      POSTGRES_DB: ${POSTGRES_DB:-genesis_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - genesis-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genesis-backend
    restart: always
    depends_on:
      - postgres
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-genesis_user}:${POSTGRES_PASSWORD:-genesis_pass}@postgres:5432/${POSTGRES_DB:-genesis_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-genesis_super_secret_jwt_key_dokploy_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DOLARVZLA_API_KEY: ${DOLARVZLA_API_KEY:-9e6461acff8c6e405a9db8688426e291cae064f0eb491cb549d1c97239324035}
      DOLARVZLA_BCV_URL: ${DOLARVZLA_BCV_URL:-https://rates.dolarvzla.com/bcv/current.json}
      DOLARVZLA_FALLBACK_URL: ${DOLARVZLA_FALLBACK_URL:-https://api.dolarvzla.com/public/usdt/exchange-rate}
      CRON_SYNC_SCHEDULE: ${CRON_SYNC_SCHEDULE:-0 8,13,17 * * 1-5}
      BUSINESS_NAME: ${BUSINESS_NAME:-Cafetín Génesis}
      BUSINESS_RIF: ${BUSINESS_RIF:-J-50123456-7}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-+58 414-9998877}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-Av. Principal, Edificio Génesis, PB - Caracas}
      BUSINESS_PAGOMOVIL_BANK: ${BUSINESS_PAGOMOVIL_BANK:-0134 - Banesco}
      BUSINESS_PAGOMOVIL_ID: ${BUSINESS_PAGOMOVIL_ID:-J-501234567}
      BUSINESS_PAGOMOVIL_PHONE: ${BUSINESS_PAGOMOVIL_PHONE:-04149998877}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-cafetin-genesis}
      N8N_WEBHOOK_DEBT_NOTIFY: ${N8N_WEBHOOK_DEBT_NOTIFY:-}
      N8N_WEBHOOK_PAYMENT_NOTIFY: ${N8N_WEBHOOK_PAYMENT_NOTIFY:-}
    networks:
      - genesis-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genesis-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '3000:80'
    networks:
      - genesis-net

volumes:
  pgdata:

networks:
  genesis-net:
    driver: bridge
